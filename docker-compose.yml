services:
  labeler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CUDA_VERSION: ${CUDA_VERSION:-13.0.1}
    image: uspol-labeler:local
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    gpus: all
    env_file:
      - .env
    environment:
      # CUDA is the default; set LABELER_PROVIDER=cpu and
      # LABELER_MODEL_FILE=model.int8.onnx for a CPU-only run.
      PROVIDER: ${LABELER_PROVIDER:-cuda}
      MODEL_FILE: ${LABELER_MODEL_FILE:-model.onnx}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "${PORT:-4199}:${PORT:-4199}"
      - "${METRICS_PORT:-4113}:${METRICS_PORT:-4113}"
    volumes:
      - ./data:/app/data
      - ./model:/app/model:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${METRICS_PORT:-4113}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
